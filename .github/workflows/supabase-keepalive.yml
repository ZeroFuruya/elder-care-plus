name: Supabase keep-alive

# The Supabase Free project pauses after roughly a week idle
# (docs/01-dev-environment.md section 8.1). Ping it every ~3 days so it stays awake.
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY. The anon key is a
# public client key; keeping it in secrets avoids committing it to the repo.

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY are not configured; skipping keep-alive."
            exit 0
          fi

          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" \
            -o /dev/null

          echo "Keep-alive ping OK."
